name: Bug
description: Something in pasadena is broken
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Claude Code version, OS, pasadena version
